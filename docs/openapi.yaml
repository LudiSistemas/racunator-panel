openapi: 3.1.0
info:
  title: Računator panel — API za aplikaciju i API za knjigovođu
  version: "1"
  summary: Prijem računa iz aplikacije Računator i čitanje računa iz knjigovodstvenog programa
  description: |
    Dva API-ja u jednom opisu:

    - **API za aplikaciju** (`/u/{slug}/…`): aplikacija Računator šalje knjigovođi račune sa PIB-om. Svaki korisnik
      ima sopstvenu adresu `/u/{slug}` i sopstveni API ključ (`Authorization: Bearer rk_…`, šema `kljucKorisnika`).
      Pogrešan ključ, nepostojeći i deaktiviran korisnik daju isti odgovor 401. Ograničenje: 60 zahteva u minutu po ključu.
    - **API za knjigovođu** (`/api/{slug}/v1/…`, samo čitanje): knjigovodstveni program čita korisnike i račune i izvozi
      mesec u CSV ili JSON. Uključuje se u panelu (Podešavanja → API za knjigovođu); ključ knjigovođe (šema
      `kljucKnjigovodje`). Isključen API, pogrešan slug i ključ daju isti 401; 120 zahteva u minutu; blokada adrese
      posle 10 promašaja ključa u 15 minuta.

    Opis na srpskom: docs/api.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{domen}/{putanja}
    variables:
      domen:
        default: domen.rs
      putanja:
        default: panel
security:
  - kljucKorisnika: []
paths:
  /u/{slug}/ping:
    get:
      summary: Provera uparivanja
      operationId: ping
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/ApiVerzija"
      responses:
        "200":
          description: Ključ i adresa su ispravni.
          headers:
            X-Racunator-Api:
              $ref: "#/components/headers/ApiVerzija"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
              example:
                ok: true
                client: Pera DOO
                accountant: Knjigovodstvo XY
                api: 1
        "401":
          $ref: "#/components/responses/Neovlascen"
        "429":
          $ref: "#/components/responses/PreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
  /u/{slug}/receipts:
    post:
      summary: Slanje računa (do 200 po zahtevu, telo do 1 MB)
      operationId: posaljiRacune
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/ApiVerzija"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZahtevRacuni"
            example:
              receipts:
                - invoiceNumber: RCVG4AFL-RCVG4AFL-234120
                  verificationUrl: https://suf.purs.gov.rs/v/?vl=A1JD...
                  sdcDateTime: "2026-10-24T21:42:31"
                  totalAmountMinor: 123456
                  sellerName: ZORA MARKET DOO
                  sellerPib: "100000000"
                  buyerPib: "101234567"
                  invoiceType: Normal
                  transactionType: Sale
                  invoiceCounter: 123/456
                  invoiceCounterExtension: ПП
                - invoiceNumber: RCVG4AFL-RCVG4AFL-234121
                  source: pfr
                  verificationUrl: https://suf.purs.gov.rs/verify
                  sdcDateTime: "2026-10-25T09:10:00"
                  totalAmountMinor: 50000
                  sellerName: ZORA MARKET DOO
                  sellerPib: "100000000"
                  buyerPib: "101234567"
                  invoiceType: Normal
                  transactionType: Sale
                  invoiceCounter: 124/457
                  invoiceCounterExtension: ПП
      responses:
        "200":
          description: Obrađeno. Svaki račun je u tačno jednoj od lista.
          headers:
            X-Racunator-Api:
              $ref: "#/components/headers/ApiVerzija"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdgovorRacuni"
              example:
                accepted: [RCVG4AFL-RCVG4AFL-234120]
                duplicates: []
                rejected:
                  - invoiceNumber: RCVG4AFL-RCVG4AFL-234121
                    reason: "sdcDateTime: očekuje se ISO 8601, npr. 2026-10-24T21:42:31"
        "400":
          description: Telo nije JSON objekat oblika {"receipts":[…]} (`invalid_body`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
        "401":
          $ref: "#/components/responses/Neovlascen"
        "413":
          description: Telo veće od 1 MB (`payload_too_large`) ili više od 200 računa (`too_many_receipts`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greska"
        "429":
          description: >-
            Više od 60 zahteva u minutu (`rate_limited`) ili bi zahtev prešao dnevni limit prihvaćenih računa (`daily_limit`,
            podrazumevano 2000 dnevno po korisniku; zahtev se tada ne upisuje ni delimično). Kod `daily_limit` polje
            `remaining` kaže koliko računa danas još može da se pošalje.
          headers:
            Retry-After:
              description: Broj sekundi do sledećeg pokušaja (za `daily_limit` do ponoći po UTC-u).
              schema:
                type: integer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Greska"
                  - type: object
                    properties:
                      remaining:
                        type: integer
                        minimum: 0
                        description: Samo uz `daily_limit`.
        "503":
          $ref: "#/components/responses/Odrzavanje"
  # --- API za knjigovođu (v1, samo čitanje): /api/{slug}/v1/…, ključ knjigovođe iz panela ---
  /api/{slug}/v1/ping:
    get:
      summary: "Knjigovođa: provera ključa"
      operationId: knjigovodjaPing
      security:
        - kljucKnjigovodje: []
      parameters:
        - $ref: "#/components/parameters/SlugKnjigovodje"
      responses:
        "200":
          description: Ključ i adresa su ispravni, API je uključen.
          headers:
            X-Racunator-Api:
              $ref: "#/components/headers/ApiVerzija"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnjigovodjaPing"
              example:
                ok: true
                accountant: Knjigovodstvo XY
                api: 1
        "401":
          $ref: "#/components/responses/KnjigovodjaNeovlascen"
        "429":
          $ref: "#/components/responses/KnjigovodjaPreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
  /api/{slug}/v1/clients:
    get:
      summary: "Knjigovođa: lista korisnika"
      operationId: knjigovodjaKorisnici
      security:
        - kljucKnjigovodje: []
      parameters:
        - $ref: "#/components/parameters/SlugKnjigovodje"
      responses:
        "200":
          description: Svi korisnici (aktivni i deaktivirani), po nazivu.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnjigovodjaKorisnik"
              example:
                items:
                  - id: 12
                    name: Pera DOO
                    active: true
                    createdAt: "2026-10-01T08:15:00Z"
                    lastSeenAt: "2026-10-24T19:45:02Z"
                    receiptsCount: 318
        "401":
          $ref: "#/components/responses/KnjigovodjaNeovlascen"
        "429":
          $ref: "#/components/responses/KnjigovodjaPreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
  /api/{slug}/v1/clients/{id}/receipts:
    get:
      summary: "Knjigovođa: računi korisnika za mesec (po stranicama)"
      operationId: knjigovodjaRacuniKorisnika
      security:
        - kljucKnjigovodje: []
      parameters:
        - $ref: "#/components/parameters/SlugKnjigovodje"
        - name: id
          in: path
          required: true
          description: ID korisnika iz `/clients`.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/Mesec"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Stranica računa, po `sdcDateTime` rastuće. Stranica posle poslednje vraća prazan `items`.
          content:
            application/json:
              schema:
                type: object
                required: [items, month, page, perPage, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnjigovodjaRacun"
                  month:
                    type: string
                    examples: ["2026-10"]
                  page:
                    type: integer
                  perPage:
                    type: integer
                  total:
                    type: integer
                    description: Ukupan broj računa korisnika u mesecu.
        "400":
          $ref: "#/components/responses/KnjigovodjaLosParametar"
        "401":
          $ref: "#/components/responses/KnjigovodjaNeovlascen"
        "404":
          $ref: "#/components/responses/KnjigovodjaNijePronadjeno"
        "429":
          $ref: "#/components/responses/KnjigovodjaPreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
  /api/{slug}/v1/receipts/{id}:
    get:
      summary: "Knjigovođa: jedan račun"
      operationId: knjigovodjaRacun
      security:
        - kljucKnjigovodje: []
      parameters:
        - $ref: "#/components/parameters/SlugKnjigovodje"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: raw
          in: query
          required: false
          description: "`1` = dodaj `rawJson` (izvorni JSON koji je aplikacija poslala, ako je sačuvan)."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Račun.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KnjigovodjaRacun"
                  - type: object
                    properties:
                      rawJson:
                        type: [string, "null"]
                        description: Samo uz `?raw=1`; JSON tekst računa kako ga je aplikacija poslala (do 8 KB).
        "401":
          $ref: "#/components/responses/KnjigovodjaNeovlascen"
        "404":
          $ref: "#/components/responses/KnjigovodjaNijePronadjeno"
        "429":
          $ref: "#/components/responses/KnjigovodjaPreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
  /api/{slug}/v1/export:
    get:
      summary: "Knjigovođa: izvoz računa za mesec (CSV ili JSON)"
      operationId: knjigovodjaIzvoz
      security:
        - kljucKnjigovodje: []
      parameters:
        - $ref: "#/components/parameters/SlugKnjigovodje"
        - $ref: "#/components/parameters/Mesec"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: clientId
          in: query
          required: false
          description: Samo jedan korisnik; bez njega svi korisnici (po nazivu, pa po vremenu).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: >-
            CSV: UTF-8 sa BOM-om, razdvajač `;`, decimalni zarez, redovi CRLF, iste kolone kao „Preuzmi CSV" u panelu
            (Datum; Prodavac; PIB prodavca; PIB kupca; Iznos; PFR broj; Vrsta računa; Vrsta transakcije; Link za proveru);
            bez `clientId` dodaje se prva kolona „Korisnik". JSON: niz računa.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnjigovodjaRacun"
        "400":
          $ref: "#/components/responses/KnjigovodjaLosParametar"
        "401":
          $ref: "#/components/responses/KnjigovodjaNeovlascen"
        "404":
          $ref: "#/components/responses/KnjigovodjaNijePronadjeno"
        "413":
          description: Izvoz bi imao više od 50000 računa (`export_too_large`) — izvezite korisnike pojedinačno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnjigovodjaGreska"
        "429":
          $ref: "#/components/responses/KnjigovodjaPreviseZahteva"
        "503":
          $ref: "#/components/responses/Odrzavanje"
components:
  securitySchemes:
    kljucKorisnika:
      type: http
      scheme: bearer
      description: API ključ korisnika iz QR koda (`rk_` + 43 znaka base64url).
    kljucKnjigovodje:
      type: http
      scheme: bearer
      description: >-
        Ključ API-ja za knjigovođu (`rk_` + 43 znaka base64url) iz panela, Podešavanja → API za knjigovođu; prikazuje se
        samo pri uključivanju i pri „Nov ključ".
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Nasumični identifikator korisnika (32 heksadecimalna znaka).
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ApiVerzija:
      name: X-Racunator-Api
      in: header
      required: false
      schema:
        type: string
        const: "1"
    SlugKnjigovodje:
      name: slug
      in: path
      required: true
      description: Nasumični deo adrese API-ja za knjigovođu (32 heksadecimalna znaka) iz panela.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    Mesec:
      name: month
      in: query
      required: true
      description: Mesec po vremenu sa računa (`sdcDateTime`), oblik `YYYY-MM`.
      schema:
        type: string
        pattern: "^(19|20|21)\\d{2}-(0[1-9]|1[0-2])$"
  headers:
    ApiVerzija:
      description: Verzija API-ja.
      schema:
        type: string
        const: "1"
  responses:
    Neovlascen:
      description: Pogrešan ključ, nepostojeći ili deaktiviran korisnik (isti odgovor u sva tri slučaja).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Greska"
          example:
            error: unauthorized
            message: Neispravan ključ ili adresa korisnika.
    PreviseZahteva:
      description: Više od 60 zahteva u minutu (`rate_limited`).
      headers:
        Retry-After:
          description: Broj sekundi do sledećeg pokušaja.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Greska"
    Odrzavanje:
      description: Panel se ažurira (`maintenance`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Greska"
    KnjigovodjaNeovlascen:
      description: API isključen, pogrešan slug ili pogrešan ključ (isti odgovor u svim slučajevima).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KnjigovodjaGreska"
          example:
            error: unauthorized
            message: Neispravan ključ ili adresa API-ja.
    KnjigovodjaPreviseZahteva:
      description: >-
        Više od 120 zahteva u minutu (`rate_limited`) ili je adresa privremeno blokirana posle 10 promašaja ključa u
        15 minuta (`auth_blocked`).
      headers:
        Retry-After:
          description: Broj sekundi do sledećeg pokušaja.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KnjigovodjaGreska"
    KnjigovodjaLosParametar:
      description: Neispravan parametar upita (`invalid_parameter`), npr. `month` nedostaje ili nije `YYYY-MM`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KnjigovodjaGreska"
    KnjigovodjaNijePronadjeno:
      description: Korisnik ili račun ne postoji (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KnjigovodjaGreska"
  schemas:
    Ping:
      type: object
      required: [ok, client, accountant, api]
      properties:
        ok:
          type: boolean
          const: true
        client:
          type: string
          description: Naziv korisnika (firme) u panelu.
        accountant:
          type: string
          description: Naziv knjigovodstva.
        api:
          type: integer
          const: 1
    Racun:
      type: object
      required: [invoiceNumber, verificationUrl, sdcDateTime, totalAmountMinor]
      description: >-
        Račun iz QR koda (`source` = `qr` ili bez polja) ili račun unet po PFR broju (`source` = `pfr`, `verificationUrl`
        tačno `https://suf.purs.gov.rs/verify`). Ako panel već ima isti račun sa `source` = `pfr`, a stigne sa `source` =
        `qr` i linkom `https://suf.purs.gov.rs/v/?vl=…`, zapis se nadograđuje i račun je u `accepted`; ostali ponovljeni
        računi su u `duplicates`.
      properties:
        invoiceNumber:
          type: string
          pattern: "^[A-Z0-9]{8}-[A-Z0-9]{8}-\\d{1,10}$"
          description: PFR broj računa; jedinstven po korisniku.
        source:
          type: [string, "null"]
          enum: [qr, pfr, null]
          default: qr
          description: "`qr` — račun iz QR koda; `pfr` — račun unet po PFR broju. Nedostaje ili `null` → `qr`."
        verificationUrl:
          type: string
          format: uri
          pattern: "^https://suf\\.purs\\.gov\\.rs/"
          maxLength: 2048
          description: "Za `qr` link sa računa (`https://suf.purs.gov.rs/v/?vl=…`); za `pfr` tačno `https://suf.purs.gov.rs/verify`."
        sdcDateTime:
          type: string
          description: ISO 8601; čuva se lokalno vreme PFR-a do sekunde.
          examples: ["2026-10-24T21:42:31"]
        totalAmountMinor:
          type: integer
          minimum: 0
          description: Ukupan iznos u parama.
        sellerName:
          type: [string, "null"]
          maxLength: 200
        sellerPib:
          type: [string, "null"]
          pattern: "^\\d{9}$"
        buyerPib:
          type: [string, "null"]
          pattern: "^\\d{9}$"
        invoiceType:
          type: [string, "null"]
          maxLength: 200
        transactionType:
          type: [string, "null"]
          maxLength: 200
        invoiceCounter:
          type: [string, "null"]
          pattern: "^\\d{1,10}/\\d{1,10}$"
          description: >-
            Brojač računa `transactionTypeCounter/totalCounter` (podatak za proveru na stranici /verify). Nedostaje, `null`
            ili prazan tekst → `null`; neispravna vrednost odbija račun.
          examples: ["123/456"]
        invoiceCounterExtension:
          type: [string, "null"]
          pattern: "^[A-ZА-ЯЂЈЉЊЋЏ]{1,4}$"
          description: >-
            Nastavak brojača: 1–4 velika slova, ćirilica ili latinica (npr. `ПП`, `ПР`, `КП`). Panel prihvata sva velika
            slova latinice i ćirilice; obrazac navodi uobičajena. Nedostaje, `null` ili prazan tekst → `null`.
          examples: ["ПП"]
      if:
        properties:
          source:
            const: pfr
        required: [source]
      then:
        properties:
          verificationUrl:
            const: https://suf.purs.gov.rs/verify
    ZahtevRacuni:
      type: object
      required: [receipts]
      properties:
        receipts:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Racun"
    OdgovorRacuni:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: array
          items:
            type: string
        duplicates:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            type: object
            required: [invoiceNumber, reason]
            properties:
              invoiceNumber:
                type: [string, "null"]
              reason:
                type: string
    Greska:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_body, unauthorized, payload_too_large, too_many_receipts, rate_limited, daily_limit, maintenance]
        message:
          type: string
    KnjigovodjaPing:
      type: object
      required: [ok, accountant, api]
      properties:
        ok:
          type: boolean
          const: true
        accountant:
          type: string
          description: Naziv knjigovodstva.
        api:
          type: integer
          const: 1
    KnjigovodjaKorisnik:
      type: object
      required: [id, name, active, createdAt, lastSeenAt, receiptsCount]
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: UTC, npr. `2026-10-01T08:15:00Z`.
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: Poslednje javljanje aplikacije (UTC) ili `null`.
        receiptsCount:
          type: integer
          description: Ukupan broj računa korisnika.
    KnjigovodjaRacun:
      type: object
      required: [id, clientId, invoiceNumber, verificationUrl, sdcDateTime, totalAmountMinor, sellerName, sellerPib,
        buyerPib, invoiceType, transactionType, source, invoiceCounter, invoiceCounterExtension, receivedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        invoiceNumber:
          type: string
          description: PFR broj računa.
        verificationUrl:
          type: string
          format: uri
          description: Link za proveru na sajtu Poreske uprave.
        sdcDateTime:
          type: string
          description: Vreme sa računa — lokalno (zidno) vreme PFR-a, `YYYY-MM-DDTHH:MM:SS`, bez zone.
          examples: ["2026-10-24T21:42:31"]
        totalAmountMinor:
          type: integer
          description: Ukupan iznos u parama.
        sellerName:
          type: [string, "null"]
        sellerPib:
          type: [string, "null"]
        buyerPib:
          type: [string, "null"]
        invoiceType:
          type: [string, "null"]
          description: Npr. `Normal`, `Advance`.
        transactionType:
          type: [string, "null"]
          description: Npr. `Sale`, `Refund`.
        source:
          type: string
          enum: [qr, pfr]
          description: >-
            `qr` — račun iz QR koda (`verificationUrl` otvara račun sa stavkama); `pfr` — račun unet po PFR broju
            (`verificationUrl` je `https://suf.purs.gov.rs/verify`, stranica za proveru po PFR broju).
        invoiceCounter:
          type: [string, "null"]
          description: Brojač računa `transactionTypeCounter/totalCounter`, npr. `123/456`; `null` ako ga aplikacija nije poslala.
          examples: ["123/456"]
        invoiceCounterExtension:
          type: [string, "null"]
          description: Nastavak brojača, npr. `ПП`; `null` ako ga aplikacija nije poslala.
          examples: ["ПП"]
        receivedAt:
          type: string
          format: date-time
          description: Vreme prijema u panelu, UTC (`…Z`).
    KnjigovodjaGreska:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [unauthorized, auth_blocked, rate_limited, invalid_parameter, not_found, export_too_large,
            method_not_allowed, maintenance]
        message:
          type: string
          description: Opis na srpskom.
