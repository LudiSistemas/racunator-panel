name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, zip, sodium, mbstring, openssl, curl
          coverage: none
          tools: composer:v2

      - name: Provera sintakse (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './build/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.txt 2>&1 || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          echo "Svi PHP fajlovi su sintaksno ispravni."

      - name: Razvojne zavisnosti
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Testovi
        run: vendor/bin/phpunit

      - name: Build install fajla
        run: php tools/build-installer.php
