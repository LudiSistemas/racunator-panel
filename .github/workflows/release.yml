name: Izdanje

# Bezbednost (vidi docs/izdavanje.md):
# - akcije su pinovane na pun SHA commit-a (komentar pokazuje verziju), checkout ne ostavlja token u .git/config;
# - poslovi su odvojeni: test (Composer, PHPUnit; bez tajni) → build (ZIP; bez tajni, bez Composer-a) →
#   sign (jedini vidi RELEASE_SIGNING_KEY; environment „release" sa obaveznim odobrenjem; samo zvanična slika
#   php:8.3-cli pinovana po digest-u, bez Composer-a i tuđih akcija) → release (jedini sa contents: write; samo artifakti).
# - tagove v* štiti ruleset u GitHub-u (ručno podešavanje, docs/izdavanje.md).

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: izdanje-${{ github.ref }}
  cancel-in-progress: false

env:
  # Zvanična slika php:8.3-cli (ima sodium, nema Composer); digest proveren 2026-10-29.
  PHP_IMAGE: php:8.3-cli@sha256:d07db734bd519927010bbc66fa42c0d6f0207a4ee8419998df40931b884a5919

jobs:
  test:
    name: Testovi
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: pdo, pdo_sqlite, zip, sodium, mbstring, openssl
          coverage: none
          tools: composer:v2

      - name: Tag mora da odgovara src/version.php
        id: version
        run: |
          VERSION="$(php -r 'echo require "src/version.php";')"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ne odgovara verziji iz src/version.php (${VERSION})."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Javni ključ za potpis mora biti postavljen
        run: |
          php -r 'require "src/autoload.php"; exit(RacunatorPanel\Services\ReleaseChecker::publicKeyConfigured() ? 0 : 1);' || {
            echo "::error::U src/Services/ReleaseChecker.php PUBLIC_KEY nije postavljen (vidi docs/izdavanje.md)."; exit 1; }

      - name: Testovi
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit

  build:
    name: Build (bez tajni)
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: PHP iz Ubuntu paketa (bez tuđih akcija i Composer-a)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends php8.3-cli php8.3-zip
          php -v

      - name: ZIP, install fajl (još bez potpisa), SHA256SUMS, changelog
        run: php tools/build-release.php --expect-version="${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paket
          path: |
            build/racunator-panel-${{ needs.test.outputs.version }}.zip
            build/CHANGELOG-${{ needs.test.outputs.version }}.md
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Potpis (Ed25519)
    needs: [test, build]
    runs-on: ubuntu-24.04
    # Tajna je u environment-u „release": GitHub čeka odobrenje održavaoca pre nego što ovaj posao dobije ključ.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paket
          path: build

      - name: Potpis ZIP-a i install fajl sa ugrađenim potpisom
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          V: ${{ needs.test.outputs.version }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::Secret RELEASE_SIGNING_KEY nije postavljen u environment-u release (vidi docs/izdavanje.md)."; exit 1
          fi
          docker pull -q "${PHP_IMAGE}"
          # Samo kod iz ovog commit-a i zvanični PHP; mreža kontejneru nije potrebna.
          docker run --rm --network none -e RELEASE_SIGNING_KEY -v "${PWD}:/w" -w /w "${PHP_IMAGE}" \
            sh -c "php tools/sign-release.php 'build/racunator-panel-${V}.zip' && php tools/build-release.php --from-zip --expect-version='${V}'"
          ls -l build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: izdanje
          path: |
            build/racunator-panel-${{ needs.test.outputs.version }}.zip
            build/racunator-panel-${{ needs.test.outputs.version }}.zip.sig
            build/racunator-panel-install.php
            build/SHA256SUMS
            build/CHANGELOG-${{ needs.test.outputs.version }}.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [test, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: izdanje
          path: build

      - name: Provera paketa
        working-directory: build
        run: |
          sha256sum -c SHA256SUMS
          test -s "racunator-panel-${{ needs.test.outputs.version }}.zip.sig"
          ls -l

      - name: Objava
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.test.outputs.version }}
        run: |
          PRE=""
          case "$V" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            "build/racunator-panel-${V}.zip" \
            "build/racunator-panel-${V}.zip.sig" \
            "build/racunator-panel-install.php" \
            "build/SHA256SUMS" \
            --title "Računator panel ${V}" \
            --notes-file "build/CHANGELOG-${V}.md" \
            ${PRE}
